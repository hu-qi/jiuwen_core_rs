name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit ledger freshness
        run: |
          cargo run -p ah-app --bin audit-ledger -- audit/ledger.json docs/generated/audit-summary.md
          git diff --exit-code -- docs/generated/audit-summary.md
      - name: Mock gate (prod profile must not contain ah-plugins-mock)
        run: cargo test -p ah-app --test mock_gate
      - name: Rust tools contract fixture (P2-01)
        run: cargo test -p ah-app --test rust_contract rust_contract_tools_fixture
      - name: Tool path containment and symlink guard (P2-01)
        run: |
          cargo test -p ah-plugins-sysop rejects_writing_through_symlinked_file
          cargo test -p ah-plugins-rails path_guard_blocks_escapes_but_allows_safe
      - name: Test
        run: cargo test --workspace


  rails-differential:
    name: LLM Rails Python/Rust differential
    runs-on: ubuntu-latest
    env:
      AGENT_CORE_REF: aeb88cd85cc43197a00615818f124e85cca053da
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python differential dependency
        run: python -m pip install "pydantic>=2,<3"
      - name: Checkout pinned agent-core reference
        run: |
          git init "$RUNNER_TEMP/agent-core"
          git -C "$RUNNER_TEMP/agent-core" remote add origin https://atomgit.com/openJiuwen/agent-core.git
          git -C "$RUNNER_TEMP/agent-core" fetch --depth 1 origin "$AGENT_CORE_REF"
          git -C "$RUNNER_TEMP/agent-core" checkout --detach FETCH_HEAD
      - name: Run normalized LLM Rails differential
        env:
          AGENT_CORE_ROOT: ${{ runner.temp }}/agent-core
        run: bash differential/run.sh llm_retry tool_retry task_completion task_planning

  coverage:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (workspace line coverage >= 80%)
        run: cargo llvm-cov --workspace --fail-under-lines 80

  production-p1:
    name: production-p1-smoke
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Production P1 composition and E2E
        run: cargo test -p ah-app --test production_boot -- --ignored --nocapture

