name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit ledger freshness
        run: |
          cargo run -p ah-app --bin audit-ledger -- audit/ledger.json docs/generated/audit-summary.md
          git diff --exit-code -- docs/generated/audit-summary.md
      - name: Mock gate (prod profile must not contain ah-plugins-mock)
        run: cargo test -p ah-app --test mock_gate
      - name: Test
        run: cargo test --workspace

  coverage:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (workspace line coverage >= 80%)
        run: cargo llvm-cov --workspace --fail-under-lines 80

  production-p1:
    name: production-p1-smoke
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Production P1 composition and E2E
        run: cargo test -p ah-app --test production_boot -- --ignored --nocapture

