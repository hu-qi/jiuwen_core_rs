name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit ledger freshness
        run: |
          cargo run -p ah-app --bin audit-ledger -- audit/ledger.json docs/generated/audit-summary.md
          git diff --exit-code -- docs/generated/audit-summary.md
      - name: Mock gate (prod profile must not contain ah-plugins-mock)
        run: cargo test -p ah-app --test mock_gate
      - name: Test
        run: cargo test --workspace

  coverage:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (workspace line coverage >= 80%)
        run: cargo llvm-cov --workspace --fail-under-lines 80

  differential:
    name: python-rust-differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # agent-core(Python 参考实现)固定 ref;升级基线时与 parity-audit 同步。
      - uses: actions/checkout@v4
        with:
          repository: https://atomgit.com/openJiuwen/agent-core.git
          ref: aeb88cd8
          path: agent-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python -m pip install pydantic
      - name: Python/Rust differential (P0-01)
        env:
          AGENT_CORE_ROOT: ${{ github.workspace }}/agent-core
        run: bash differential/run.sh
