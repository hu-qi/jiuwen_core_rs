[workspace]
resolver = "2"
members = [
    "crates/ah-contracts",
    "crates/ah-hub",
    "crates/ah-plugins-mock",
    "crates/ah-plugins-tools",
    "crates/ah-plugins-sysop",
    "crates/ah-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ah-contracts = { path = "crates/ah-contracts" }
ah-hub = { path = "crates/ah-hub" }
ah-plugins-mock = { path = "crates/ah-plugins-mock" }
ah-plugins-tools = { path = "crates/ah-plugins-tools" }
ah-plugins-sysop = { path = "crates/ah-plugins-sysop" }
ah-app = { path = "crates/ah-app" }
