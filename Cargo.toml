[workspace]
resolver = "2"
members = [
    "crates/ah-contracts",
    "crates/ah-hub",
    "crates/ah-plugins-context",
    "crates/ah-plugins-store",
    "crates/ah-plugins-prompt",
    "crates/ah-plugins-queue",
    "crates/ah-plugins-workspace",
    "crates/ah-plugins-sandbox",
    "crates/ah-plugins-code",
    "crates/ah-plugins-web",
    "crates/ah-plugins-transport",
    "crates/ah-plugins-mock",
    "crates/ah-plugins-tools",
    "crates/ah-plugins-sysop",
    "crates/ah-plugins-openai",
    "crates/ah-plugins-agent-loop",
    "crates/ah-plugins-rails",
    "crates/ah-plugins-session-log",
    "crates/ah-plugins-workflow",
    "crates/ah-plugins-memory",
    "crates/ah-plugins-mcp",
    "crates/ah-plugins-credentials",
    "crates/ah-plugins-retrieval",
    "crates/ah-plugins-security",
    "crates/ah-plugins-subagent",
    "crates/ah-plugins-teams",
    "crates/ah-plugins-evolving",
    "crates/ah-plugins-rsi",
    "crates/ah-plugins-telemetry",
    "crates/ah-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ah-contracts = { path = "crates/ah-contracts" }
ah-hub = { path = "crates/ah-hub" }
