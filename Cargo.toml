ah-plugins-sandbox = { path = "crates/ah-plugins-sandbox" }
ah-plugins-code = { path = "crates/ah-plugins-code" }
ah-plugins-web = { path = "crates/ah-plugins-web" }
ah-plugins-transport = { path = "crates/ah-plugins-transport" }
ah-plugins-mock = { path = "crates/ah-plugins-mock" }
