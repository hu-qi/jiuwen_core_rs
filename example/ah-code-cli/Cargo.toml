[package]
name = "ah-code-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runnable Claude Code-style developer CLI example for agent-harness"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
ah-plugins-agent-control = { workspace = true }
ah-plugins-agent-loop = { workspace = true }
ah-plugins-cli = { path = "plugins/ah-plugins-cli" }
ah-plugins-mock = { workspace = true }
ah-plugins-model-backup = { workspace = true }
ah-plugins-openai = { workspace = true }
ah-plugins-session-log = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-tools = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "ah_code_cli"
path = "src/lib.rs"

[[bin]]
name = "ah-code"
path = "src/main.rs"
