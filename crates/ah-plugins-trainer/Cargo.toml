[package]
name = "ah-plugins-trainer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real self-evolution trainer: baseline -> loop { train forward, optimizer updates via operator seam, validation gate, improve-only checkpoint } with early stop"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-session-log = { workspace = true }
ah-plugins-subagent = { workspace = true }
ah-plugins-evolving = { workspace = true }
ah-plugins-rsi = { workspace = true }
ah-plugins-operator = { workspace = true }
ah-plugins-optimizer = { workspace = true }
