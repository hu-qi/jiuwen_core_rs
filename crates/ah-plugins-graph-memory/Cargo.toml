[package]
name = "ah-plugins-graph-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real graph memory: entity/relation/episode knowledge graph with JSONL persistence, deterministic extraction, keyword search and neighbor traversal"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-session-log = { workspace = true }
