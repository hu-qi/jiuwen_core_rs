[package]
name = "ah-plugins-retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Production retrieval with local or external embedding and Redis-backed vector index"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
ah-plugins-tools = { workspace = true }
ah-plugins-store = { workspace = true }
