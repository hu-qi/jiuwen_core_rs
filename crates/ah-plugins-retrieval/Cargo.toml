[package]
name = "ah-plugins-retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real local knowledge-base retrieval (BM25-style, JSON persistence) with ingest/search tools"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
ah-plugins-tools = { workspace = true }
