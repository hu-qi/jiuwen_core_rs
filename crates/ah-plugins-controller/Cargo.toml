[package]
name = "ah-plugins-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real controller: task lifecycle/priority/hierarchy, executor-registry scheduling with conflict handling, deterministic intent recognition"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-session-log = { workspace = true }
ah-plugins-subagent = { workspace = true }
