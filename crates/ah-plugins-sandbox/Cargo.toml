[package]
name = "ah-plugins-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real policy-driven sandbox: sandbox.json (path prefixes, denied command patterns) consumed by a tools/pre-execute rail"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
ah-plugins-tools = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
ah-plugins-sysop = { workspace = true }
