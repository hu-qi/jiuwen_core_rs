[package]
name = "ah-plugins-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real HTTP client (ureq): GET with timeout, status/headers/body; TLS optional"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
ureq = { version = "2.12", default-features = false }
serde_json = "1"

[dev-dependencies]
ah-plugins-tools = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
