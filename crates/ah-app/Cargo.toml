[package]
name = "ah-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "agent-harness boot entry: compose a profile, mount plugins, run"

[[bin]]
name = "ah-app"
path = "src/main.rs"

[[bin]]
name = "ah-cli"
path = "src/bin/ah-cli.rs"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-openai = { workspace = true }
ah-plugins-agent-loop = { workspace = true }
ah-plugins-rails = { workspace = true }
ah-plugins-session-log = { workspace = true }
ah-plugins-workflow = { workspace = true }
ah-plugins-memory = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
