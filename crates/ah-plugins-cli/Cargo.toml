[package]
name = "ah-plugins-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real cli renderer: Claude Code style terminal output for agent events (tool calls/results, todo checkboxes, messages)"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-session-log = { workspace = true }
