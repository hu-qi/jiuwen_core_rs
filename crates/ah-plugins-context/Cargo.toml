[package]
name = "ah-plugins-context"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real context engine: token-budgeted assembly, deterministic excerpt compression with optional LLM summarization, offload to JSONL"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
ah-plugins-tokenizer = { workspace = true }
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-prompt-attachment = { workspace = true }
ah-plugins-session-log = { workspace = true }