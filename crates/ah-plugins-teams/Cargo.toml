[package]
name = "ah-plugins-teams"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real multi-agent team runtime: task board, dependencies, review, settle, subagent delegation"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-session-log = { workspace = true }
ah-plugins-subagent = { workspace = true }
