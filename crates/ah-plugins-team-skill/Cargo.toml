[package]
name = "ah-plugins-team-skill"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real team skill generator: deterministic skill plan from a task, register into skill seam, validate by evaluating on the source task with repair retries"

[dependencies]
ah-contracts = { workspace = true }
ah-hub = { workspace = true }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
ah-plugins-mock = { workspace = true }
ah-plugins-tools = { workspace = true }
ah-plugins-sysop = { workspace = true }
ah-plugins-session-log = { workspace = true }
ah-plugins-subagent = { workspace = true }
ah-plugins-evolving = { workspace = true }
ah-plugins-skill = { workspace = true }
