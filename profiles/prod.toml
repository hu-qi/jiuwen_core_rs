# prod profile:真实实现。
# - ah-plugins-tools: 真实工具注册表(含工具执行管线)
# - ah-plugins-sysop: 真实 fs/shell 执行
# - ah-plugins-rails: 真实 rails(ShellGuard)
# - ah-plugins-security: 真实安全检测(guardrails + pre-execute rail)
# - ah-plugins-session-log: 真实会话事件日志(JSONL + 多会话)
# - ah-plugins-workflow: 真实工作流引擎
# - ah-plugins-memory: 真实持久化记忆
# - ah-plugins-retrieval: 真实知识库检索
# - ah-plugins-subagent: 真实子代理(隔离会话委派)
# - ah-plugins-mcp: 真实 MCP stdio 客户端(懒 spawn,首次调用时拉起子进程)
# - ah-plugins-credentials: 真实凭据引用(环境变量 provider,只读)
# - ah-plugins-telemetry: 真实 telemetry(span 记录 + JSONL 导出,OTLP 留待后续)
# - ah-plugins-openai: 真实 LLM provider(先查 credentials seam 的 openai.api_key,
#   再 fallback OPENAI_API_KEY;两者都无 key 时挂载失败并显式报错)
# - ah-plugins-agent-loop: 真实 ReAct 循环(日志驱动)
# 无 mock 插件;mock 门禁校验通过。
name = "prod"

[[bundles]]
id = "real"
plugins = ["ah-plugins-credentials", "ah-plugins-tools", "ah-plugins-sysop", "ah-plugins-rails", "ah-plugins-security", "ah-plugins-session-log", "ah-plugins-workflow", "ah-plugins-memory", "ah-plugins-retrieval", "ah-plugins-subagent", "ah-plugins-mcp", "ah-plugins-telemetry", "ah-plugins-openai", "ah-plugins-agent-loop"]
