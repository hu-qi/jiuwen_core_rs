# prod profile:真实实现。
# - ah-plugins-tools: 真实工具注册表(含工具执行管线)
# - ah-plugins-sysop: 真实 fs/shell 执行
# - ah-plugins-rails: 真实 rails(ShellGuard)
# - ah-plugins-session-log: 真实会话事件日志(JSONL + 多会话)
# - ah-plugins-workflow: 真实工作流引擎
# - ah-plugins-memory: 真实持久化记忆
# - ah-plugins-openai: 真实 LLM provider(需 OPENAI_API_KEY;缺失时挂载失败并显式报错)
# - ah-plugins-agent-loop: 真实 ReAct 循环(日志驱动)
# 无 mock 插件;mock 门禁校验通过。
name = "prod"

[[bundles]]
id = "real"
plugins = ["ah-plugins-tools", "ah-plugins-sysop", "ah-plugins-rails", "ah-plugins-session-log", "ah-plugins-workflow", "ah-plugins-memory", "ah-plugins-openai", "ah-plugins-agent-loop"]
