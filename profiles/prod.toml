# prod profile:真实实现。
# - ah-plugins-tools: 真实工具注册表(含工具执行管线)
# - ah-plugins-sysop: 真实 fs/shell 执行
# - ah-plugins-rails: 真实 rails(ShellGuard / PathGuard / ToolBudget)
# - ah-plugins-security: 真实安全检测(guardrails + pre-execute rail)
# - ah-plugins-session-log: 真实会话事件日志(JSONL + 多会话)
# - ah-plugins-workflow: 真实工作流引擎
# - ah-plugins-memory: 真实持久化记忆
# - ah-plugins-retrieval: 真实知识库检索
# - ah-plugins-subagent: 真实子代理(隔离会话委派)
# - ah-plugins-teams-sqlite: 真实多 agent 团队运行时(SQLite 持久化)
# - ah-plugins-teams-workflow: 真实 swarmflow 编排(phase/agent/预算/journal 续跑)
# - ah-plugins-team-monitor: 真实团队只读监控(团队/任务/消息视图 + teams/task 事件日志)
# - ah-plugins-evolving: 真实轨迹抽取/评估/优化
# - ah-plugins-rsi: 真实 RSI 管线(数据集/评测/精化/checkpoint)
# - ah-plugins-rsi-analyzer: 真实评测结果分析(信号提取/根因归因/artifact)
# - ah-plugins-rsi-single-harness: 真实单 harness 迭代编排 + 候选门禁(holdout 门禁/续跑)
# - ah-plugins-context: 真实上下文引擎(预算组装/压缩/offload)
# - ah-plugins-context-evolver: 真实任务记忆服务(保存/检索/轨迹凝练摘要/注入)
# - ah-plugins-tokenizer: 真实确定性 tokenizer(BPE-lite + CJK 感知,上下文预算精确化)
# - ah-plugins-store-redis: 真实 Redis 后端 store(需本地 Redis 容器)
# - ah-plugins-prompt: 真实版本化 prompt 注册表
# - ah-plugins-queue: 真实文件后端消息队列(日志+游标)
# - ah-plugins-workspace: 真实工作区清单(workspace.json + 目标状态机)
# - ah-plugins-sandbox: 真实策略化沙箱(sandbox.json + pre-execute rail)
# - ah-plugins-code: 真实代码执行(隔离 scratch + python3 子进程 + 超时)
# - ah-plugins-web: 真实 HTTP 客户端(ureq,plain http)
# - ah-plugins-transport: 真实 A2A 风格传输(JSON-RPC 2.0 over HTTP)
# - ah-plugins-git: 真实本地 git 操作(auto_harness 基建)
# - ah-plugins-ci: 真实 CI gate 运行器(子进程门禁)
# - ah-plugins-autoharness: 真实自动改进周期(assess→publish)
# - ah-plugins-rl: 真实 RL 奖励函数(agent_rl reward 部分)
# - ah-plugins-rl-step: 真实 RL 训练步数学(advantage/ratio/clipped PPO objective/value loss)
# - ah-plugins-rerank: 真实检索重排(词法+向量融合 + 多样性惩罚)
# - ah-plugins-sharing: 真实经验分享(本地文件 hub 后端 + stage/flush/镜像)
# - ah-plugins-experience-scorer: 真实经验评分(贝叶斯有效性/利用率/新鲜度衰减 + 版本过期惩罚)
# - ah-plugins-json-parser: 真实 LLM 输出 JSON 解析(围栏提取 + 流式累加)
# - ah-plugins-model-catalog: 真实 OpenAI 账号模型目录(/models 获取 + 可见性过滤 + 前向兼容 + 缓存兜底)
# - ah-plugins-signals: 真实演化信号映射(问题→trajectory_issue 信号,类型归因/归一化/摘录)
# - ah-plugins-dataset-curator: 真实回放数据集策展(失败可判题用例 → replay 数据集 + 定向种子 + 报告)
# - ah-plugins-team-dispatch: 真实团队运行派发决策(7 路 truth table,纯函数)
# - ah-plugins-team-pool: 真实团队对象池(team_name 键) + InteractGate 并发门禁
# - ah-plugins-team-status: 真实成员/执行状态机(迁移表 + departed/unreachable/settled 集合)
# - ah-plugins-team-verdict: 真实审查投票判定(pass 配额 ceil(threshold×n)/fail 不可达即败)
# - ah-plugins-team-message: 真实两阶段消息渲染(meta 意图 → 单遍 {{ns.field}} 替换 + 字段白名单)
# - ah-plugins-subagents: 真实类型化子代理(code/research/plan/verify + 工具白名单)
# - ah-plugins-skill: 真实技能注册 + 评估(subagent 委派 + evolving 轨迹)
# - ah-plugins-team-skill: 真实团队技能生成(任务 → 计划/注册/验证/修复重试)
# - ah-plugins-pregel: 真实超级步图引擎(状态通道/条件触发/中断)
# - ah-plugins-tune: 真实训练流水线(subagent 执行 + evolving 评估/优化)
# - ah-plugins-oauth: 真实设备码 OAuth 客户端(Device Authorization Grant)
# - ah-plugins-agentbuilder: 真实 agent 构建(NL→设计→DSL→工作流执行)
# - ah-plugins-cli: 真实终端渲染(Claude Code 风格:工具调用/结果/todo checkbox)
# - ah-plugins-external: 真实外部 CLI agent 运行时(流式 stdin + 单发 argv,子进程真实拉起)
# - ah-plugins-controller: 真实控制器(任务生命周期/优先级/层级/调度冲突/意图识别)
# - ah-plugins-operator: 真实自进化算子(LLM/tool/memory/skill 参数句柄 + freeze + 回调)
# - ah-plugins-optimizer: 真实文本梯度优化器(评估问题 → 算子参数更新,冻结感知)
# - ah-plugins-trainer: 真实自进化训练循环(基线 → 前向/更新/验证门禁 → 改进 checkpoint,early stop)
# - ah-plugins-runner: 真实回调链(优先级顺序/retry/timeout/break/rollback + 指标)
# - ah-plugins-graph-memory: 真实知识图谱记忆(实体/关系/episode + 检索/邻居 + 工具)
# - ah-plugins-mcp: 真实 MCP stdio 客户端(懒 spawn,首次调用时拉起子进程)
# - ah-plugins-credentials: 真实凭据引用(环境变量 provider,只读)
# - ah-plugins-telemetry: 真实 telemetry(span 记录 + JSONL 导出,OTLP 留待后续)
# - ah-plugins-openai: 真实 LLM provider(先查 credentials seam 的 openai.api_key,
#   再 fallback OPENAI_API_KEY;两者都无 key 时挂载失败并显式报错)
# - ah-plugins-agent-loop: 真实 ReAct 循环(日志驱动)
# 无 mock 插件;mock 门禁校验通过。
name = "prod"

