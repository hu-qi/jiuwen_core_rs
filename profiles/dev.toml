# dev profile:
# - ah-plugins-mock: 仅 llm boot 桩(真实 LLM provider 需凭据,落地前保持)
# - ah-plugins-tools: 真实工具注册表(含工具执行管线)
# - ah-plugins-sysop: 真实 fs/shell 执行(真实副作用)
# - ah-plugins-rails: 真实 rails(ShellGuard)
# - ah-plugins-security: 真实安全检测(guardrails + pre-execute rail)
# - ah-plugins-session-log: 真实会话事件日志(JSONL + 多会话)
# - ah-plugins-workflow: 真实工作流引擎
# - ah-plugins-memory: 真实持久化记忆
# - ah-plugins-retrieval: 真实知识库检索
# - ah-plugins-subagent: 真实子代理(隔离会话委派)
# - ah-plugins-teams: 真实多 agent 团队运行时
# - ah-plugins-evolving: 真实轨迹抽取/评估/优化
# - ah-plugins-rsi: 真实 RSI 管线(数据集/评测/精化/checkpoint)
# - ah-plugins-context: 真实上下文引擎(预算组装/压缩/offload)
# - ah-plugins-store: 真实文件后端 store(KV + message)
# - ah-plugins-prompt: 真实版本化 prompt 注册表
# - ah-plugins-mcp: 真实 MCP stdio 客户端(懒 spawn,首次调用时拉起子进程)
# - ah-plugins-credentials: 真实凭据引用(环境变量 provider,只读)
# - ah-plugins-telemetry: 真实 telemetry(span 记录 + JSONL 导出,OTLP 留待后续)
# - ah-plugins-agent-loop: 真实 ReAct 循环(日志驱动)
name = "dev"

[[bundles]]
id = "boot"
plugins = ["ah-plugins-mock", "ah-plugins-credentials", "ah-plugins-tools", "ah-plugins-sysop", "ah-plugins-rails", "ah-plugins-security", "ah-plugins-session-log", "ah-plugins-workflow", "ah-plugins-memory", "ah-plugins-retrieval", "ah-plugins-subagent", "ah-plugins-teams", "ah-plugins-evolving", "ah-plugins-rsi", "ah-plugins-context", "ah-plugins-store", "ah-plugins-prompt", "ah-plugins-mcp", "ah-plugins-telemetry", "ah-plugins-agent-loop"]
